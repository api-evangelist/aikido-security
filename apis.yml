apis:
  - aid: aikido-security:aikido-rest-api
    name: Aikido Security REST API
    description: >-
      Aikido Security's REST API provides programmatic access to the Aikido
      platform across issues and findings, code repositories and SBOM export,
      cloud resources (AWS, Azure, GCP, Kubernetes), container registries and
      image scans, domains and API surface, compliance frameworks (CIS, ISO
      27001, NIS2, SOC2), custom SAST rules (Semgrep), AI pentesting drafts
      and assessments, task tracking integrations, webhooks, teams and users
      with permissions, Zen app-protection (bot protection, IP blocking,
      threat configurations), and activity logs with PDF export. Authentication
      is via access tokens issued through the authorization endpoint.
    humanURL: https://apidocs.aikido.dev/reference/introduction
