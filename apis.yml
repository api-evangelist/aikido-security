aid: aikido-security
name: Aikido Security
description: >-
  Aikido Security is a developer-first all-in-one application security platform
  that consolidates SAST, SCA, secret detection, container scanning, IaC
  scanning, CSPM, DAST, API security, malware detection, cloud posture, and AI
  pentesting into a single product designed for engineering teams. Aikido
  exposes a public REST API at apidocs.aikido.dev covering issues, code
  repositories, cloud resources, containers, domains and APIs, compliance
  (SOC2, ISO 27001, NIS2, CIS), custom SAST rules, AI pentesting, task
  tracking, webhooks, user and team management, Zen app-protection
  configuration, and activity logging.
kind: company
